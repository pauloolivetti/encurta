services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Configuração enxuta: o padrão reserva mais memória do que um servidor pequeno (1 GB) aguenta
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=25"]
    environment:
      POSTGRES_DB: encurta
      POSTGRES_USER: encurta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env (copie o .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurta -d encurta"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: encurta
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: encurta
      BASE_URL: ${BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
